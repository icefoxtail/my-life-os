<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>패턴 기차 공작소 · 실제 게임 검수</title><link id="sihyeon-pattern-train-style" rel="stylesheet" href="../css/games/pattern-train.css"><style>html,body,#train-fixture{width:100%;height:100%;margin:0;overflow:hidden}#qa-results{position:fixed;inset:0;overflow:auto;background:#fffaf0;color:#244b47;font:14px/1.5 monospace;padding:20px;z-index:100000;white-space:pre-wrap}#qa-results[hidden]{display:none}</style></head><body><div id="train-fixture"></div><pre id="qa-results" hidden></pre><script src="../js/play-settings.js"></script><script src="../js/games/pattern-train-model.js"></script><script src="../js/games/pattern-train.js"></script><script>
const parameters = new URLSearchParams(location.search);
if ([4,5,6,7].includes(Number(parameters.get('age')))) SihyeonPlaySettings.setAge(Number(parameters.get('age')));
const fixtureOptions = {say: () => Promise.resolve(false), closeToParkHome: () => {document.querySelector('#train-fixture').innerHTML = '<button id="return-to-train" style="font:24px system-ui;padding:30px">작품으로 돌아가기</button>';document.querySelector('#return-to-train').onclick=()=>SihyeonGames.patternTrain.render(document.querySelector('#train-fixture'),fixtureOptions);}};
