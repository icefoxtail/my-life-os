<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="shadow-cam" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#364FC7" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="grad-cam-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#748FFC"/>
      <stop offset="50%" stop-color="#4C6EF5"/>
      <stop offset="100%" stop-color="#364FC7"/>
    </linearGradient>
    <linearGradient id="grad-cam-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B3E9C"/>
      <stop offset="100%" stop-color="#18235C"/>
    </linearGradient>
    <linearGradient id="grad-cam-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22B8CF"/>
      <stop offset="40%" stop-color="#15AABF"/>
      <stop offset="100%" stop-color="#0C8599"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow-cam)">
    <!-- 3D Base Depth -->
    <rect x="14" y="32" width="72" height="48" rx="14" fill="url(#grad-cam-depth)" transform="translate(0, 5)"/>
    <!-- Top Flash Depth -->
    <path d="M38 28 L62 28 L58 32 L42 32 Z" fill="url(#grad-cam-depth)" transform="translate(0, 5)"/>

    <!-- Shutter Button on Top Right -->
    <rect x="66" y="24" width="14" height="6" rx="3" fill="#FF8787"/>
    <!-- Top Flash Housing -->
    <path d="M36 28 C36 25 39 24 43 24 L57 24 C61 24 64 25 64 28 L60 32 L40 32 Z" fill="#91A7FF"/>

    <!-- Main Body -->
    <rect x="14" y="30" width="72" height="48" rx="14" fill="url(#grad-cam-body)"/>

    <!-- Top Gloss Bar -->
    <rect x="18" y="33" width="64" height="6" rx="3" fill="#DBE4FF" opacity="0.6"/>

    <!-- Big Center Lens Outer Ring -->
    <circle cx="50" cy="54" r="20" fill="#2B3E9C"/>
    <circle cx="50" cy="54" r="18" fill="#1C2763"/>
    <!-- Center Lens -->
    <circle cx="50" cy="54" r="15" fill="url(#grad-cam-lens)"/>
    <!-- Lens Glass Reflection Arc -->
    <path d="M42 44 A12 12 0 0 1 58 44" stroke="#E3FAFC" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="56" cy="58" r="2.5" fill="#E3FAFC" opacity="0.8"/>

    <!-- Small Corner Viewfinder / Indicator -->
    <circle cx="74" cy="40" r="3.5" fill="#FFD43B"/>
    <circle cx="26" cy="40" r="2.5" fill="#BAC8FF"/>
  </g>
</svg>
