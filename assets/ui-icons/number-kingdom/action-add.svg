<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="shadow-add" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#B86200" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="grad-plus-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFDD33"/>
      <stop offset="50%" stop-color="#FFA812"/>
      <stop offset="100%" stop-color="#F27800"/>
    </linearGradient>
    <linearGradient id="grad-plus-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF9D2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grad-plus-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C75A00"/>
      <stop offset="100%" stop-color="#8F3C00"/>
    </linearGradient>
  </defs>

  <!-- Extruded 3D Base -->
  <path d="M42 20 C42 16 46 16 50 16 C54 16 58 16 58 20 L58 42 L80 42 C84 42 84 46 84 50 C84 54 84 58 80 58 L58 58 L58 80 C58 84 54 84 50 84 C46 84 42 84 42 80 L42 58 L20 58 C16 58 16 54 16 50 C16 46 16 42 20 42 L42 42 Z"
        fill="url(#grad-plus-depth)" transform="translate(0, 6)"/>

  <!-- Main Chunky Plus Symbol -->
  <g filter="url(#shadow-add)">
    <path d="M42 18 C42 13 45 12 50 12 C55 12 58 13 58 18 L58 42 L82 42 C87 42 88 45 88 50 C88 55 87 58 82 58 L58 58 L58 82 C58 87 55 88 50 88 C45 88 42 87 42 82 L42 58 L18 58 C13 58 12 55 12 50 C12 45 13 42 18 42 L42 42 Z"
          fill="url(#grad-plus-base)"/>
    <!-- Top Gel Gloss Highlight -->
    <path d="M44 20 C44 16 47 15 50 15 C53 15 56 16 56 20 L56 44 L80 44 C84 44 85 47 85 50 C85 51 84 52 82 52 L54 52 C53 52 52 53 52 54 L52 82 C52 84 51 85 50 85 C49 85 48 84 48 82 L48 54 C48 53 47 52 46 52 L18 52 C16 52 15 51 15 50 C15 47 16 44 20 44 L44 44 Z"
          fill="url(#grad-plus-rim)"/>
  </g>

  <!-- Incoming Converging Mini-Cubes -->
  <!-- Top Left Cube (Cyan) -->
  <g transform="translate(14, 16)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#38D9A9" stroke="#12B886" stroke-width="1.5"/>
    <path d="M2 3 L12 3" stroke="#C3FAE8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Inward Motion Trail -->
    <path d="M16 16 L22 22" stroke="#FFA812" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Top Right Cube (Pink) -->
  <g transform="translate(72, 16)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#FF6B8B" stroke="#E64980" stroke-width="1.5"/>
    <path d="M2 3 L12 3" stroke="#FCC2D7" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-2 16 L-8 22" stroke="#FFA812" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Bottom Left Cube (Purple) -->
  <g transform="translate(14, 70)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#9775FA" stroke="#7950F2" stroke-width="1.5"/>
    <path d="M2 3 L12 3" stroke="#E5DBFF" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M16 -2 L22 -8" stroke="#FFA812" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Bottom Right Cube (Lime) -->
  <g transform="translate(72, 70)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#94D82D" stroke="#74B816" stroke-width="1.5"/>
    <path d="M2 3 L12 3" stroke="#D8F5A2" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-2 -2 L-8 -8" stroke="#FFA812" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
