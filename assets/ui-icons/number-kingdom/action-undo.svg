<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="shadow-undo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1864AB" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="grad-undo-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4DABF7"/>
      <stop offset="50%" stop-color="#228BE6"/>
      <stop offset="100%" stop-color="#1971C2"/>
    </linearGradient>
    <linearGradient id="grad-undo-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1864AB"/>
      <stop offset="100%" stop-color="#0B3E75"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow-undo)">
    <!-- 3D Depth underneath -->
    <path d="M48 20 A28 28 0 1 1 24 58 L14 58 L28 40 L42 58 L32 58 A20 20 0 1 0 48 28 Z"
          fill="url(#grad-undo-depth)" transform="translate(0, 5)"/>

    <!-- Main Curved Reverse Arrow -->
    <path d="M48 18 A30 30 0 1 1 22 58 L12 58 C10 58 9 55 11 53 L27 34 C29 32 32 32 34 34 L50 53 C52 55 51 58 49 58 L38 58 A20 20 0 1 0 48 26 C50 26 52 24 52 22 C52 20 50 18 48 18 Z"
          fill="url(#grad-undo-base)"/>

    <!-- Top Gel Gloss Highlight -->
    <path d="M48 20 A27 27 0 0 1 74 44 C74 32 62 20 48 20 Z"
          fill="#E7F5FF" opacity="0.6"/>
    <ellipse cx="29" cy="40" rx="4" ry="7" transform="rotate(-30 29 40)" fill="#E7F5FF" opacity="0.7"/>
  </g>

  <!-- Speed Arc / Motion Sparks -->
  <path d="M82 46 A34 34 0 0 0 54 14" stroke="#A5D8FF" stroke-width="2.5" stroke-dasharray="4,6" stroke-linecap="round" fill="none"/>
  <circle cx="82" cy="54" r="2.5" fill="#A5D8FF"/>
</svg>
