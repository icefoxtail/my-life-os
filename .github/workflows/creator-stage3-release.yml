name: Creator stage 3 release

on:
  pull_request:
    paths:
      - 'js/games/art-zone.js'
      - 'js/games/car-garage.js'
      - 'js/play-objects.js'
      - 'index.html'
      - 'sw.js'
      - 'scripts/test-creator-art-collection.cjs'
      - 'scripts/test-creator-garage.cjs'
      - 'scripts/qa-creator-art-collection-browser.py'
      - 'scripts/qa-creator-garage-browser.py'
      - '.github/workflows/creator-stage3-release.yml'
  push:
    branches: [main]
    paths:
      - 'js/games/art-zone.js'
      - 'js/games/car-garage.js'
      - 'js/play-objects.js'
      - 'index.html'
      - 'sw.js'
      - 'scripts/test-creator-art-collection.cjs'
      - 'scripts/test-creator-garage.cjs'
      - 'scripts/qa-creator-art-collection-browser.py'
      - 'scripts/qa-creator-garage-browser.py'
      - '.github/workflows/creator-stage3-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage3-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Saved work, garage state and direct bridge regression
        run: |
          node --check js/games/art-zone.js
          node --check js/games/car-garage.js
          node scripts/test-creator-art-collection.cjs
          node scripts/test-creator-garage.cjs
          node scripts/qa-art-play-bridge.cjs
          node scripts/qa-artwork-choices.cjs
          node scripts/qa-art-restore-independent.cjs
          node scripts/qa-art-pending-save.cjs
          node scripts/qa-storage-write-failure.cjs
          node scripts/qa-sw-independent.cjs
          python3 -m py_compile scripts/qa-creator-art-collection-browser.py scripts/qa-creator-garage-browser.py

  stage3-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Chromium
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - name: Wait for the exact deployed stage 3 runtime
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,time,urllib.request
          paths=['sw.js','index.html','js/play-objects.js','js/games/art-zone.js','js/games/car-garage.js']
          expected={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          base='https://icefoxtail.github.io/my-life-os/'
          out=pathlib.Path('qa-stage3-evidence');out.mkdir(exist_ok=True)
          deadline=time.monotonic()+50*60
          while time.monotonic()<deadline:
              actual={}
              try:
                  for path in paths:
                      with urllib.request.urlopen(base+path+'?stage3='+expected['sw.js'][:12],timeout=15) as response:
                          actual[path]=hashlib.sha256(response.read()).hexdigest()
              except Exception as error:
                  print(type(error).__name__,flush=True)
              if actual==expected:
                  (out/'production-source.json').write_text(json.dumps({'baseUrl':base,'matches':True,'expected':expected,'actual':actual},indent=2))
                  break
              time.sleep(5)
          else:
              raise SystemExit('Exact main runtime not served by Pages; stage 3 production play did not run.')
          PY
      - name: Actual previews, collections, repairs and reused vehicles
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          status=0
          args=()
          if [ "$EVENT_NAME" = push ]; then
            args=(--base-url https://icefoxtail.github.io/my-life-os/)
          fi
          for suite in art-collection garage; do
            python3 "scripts/qa-creator-$suite-browser.py" "${args[@]}" --output "qa-stage3-evidence/$suite" || status=1
          done
          exit "$status"
      - name: Preserve exact-source reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: creator-stage3-${{ github.run_id }}
          path: qa-stage3-evidence/
          if-no-files-found: error
          retention-days: 14
