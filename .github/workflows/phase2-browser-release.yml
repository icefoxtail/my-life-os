name: Phase 2 browser release
on:
  pull_request:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'scripts/qa-phase2-release-browser.py'
      - 'scripts/qa-pattern-train*'
      - 'scripts/qa-home-voice-browser.py'
      - 'scripts/qa-number-picture-browser.py'
      - 'scripts/qa-ten-frame-garden-browser.py'
      - 'scripts/qa-picture-arithmetic-browser.py'
      - 'scripts/qa-art-reference-browser.py'
      - '.github/workflows/phase2-browser-release.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/games/pattern-train*'
      - 'css/games/pattern-train.css'
      - 'scripts/qa-phase2-release-browser.py'
      - '.github/workflows/phase2-browser-release.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned browser harness
        run: |
          mkdir -p qa-release-evidence
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Vehicle grammar and game interaction regression
        run: python3 scripts/qa-vehicle-grammar-browser.py --output qa-release-evidence/vehicle-grammar
      - name: Latest train fixture, real menu and legacy entry checks
        run: python3 scripts/qa-phase2-release-browser.py --output qa-release-evidence
      - name: Native Chromium English Listening and mode-switch verification
        run: python3 scripts/qa-english-listening-browser.py --output qa-release-evidence/english
      - name: Menu arrival voice and cancellation regression
        run: python3 scripts/qa-menu-voice-browser.py --output qa-release-evidence/menu-voice
      - name: Korean and English tap-to-speech synchronization
        run: python3 scripts/qa-voice-label-sync-browser.py --output qa-release-evidence/voice-sync
      - name: Home welcome and guide voice regression
        run: python3 scripts/qa-home-voice-browser.py --output qa-release-evidence/home-voice
      - name: Attach source-bound evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase2-browser-${{ github.run_id }}
          path: qa-release-evidence/
          if-no-files-found: error
          retention-days: 14
  production-ui:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYGROUND_LIVE_GAME: art-reference
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned browser harness
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Wait for the exact main runtime on Pages
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, time, urllib.request
          paths = ['sw.js', 'index.html', 'js/games/art-zone.js', 'css/play-settings.css']
          expected = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          base = 'https://icefoxtail.github.io/my-life-os/'
          for attempt in range(48):
              actual = {}
              try:
                  for path in paths:
                      with urllib.request.urlopen(base + path + '?release=' + expected['sw.js'][:12], timeout=15) as response:
                          actual[path] = hashlib.sha256(response.read()).hexdigest()
              except Exception as error:
                  print(type(error).__name__, flush=True)
              if actual == expected:
                  pathlib.Path('qa-production-evidence').mkdir(exist_ok=True)
                  pathlib.Path('qa-production-evidence/deployed-runtime.json').write_text(json.dumps({'base':base,'expected':expected,'actual':actual,'matches':True}, indent=2))
                  break
              time.sleep(5)
          else:
              raise SystemExit('Pages has not served the exact main runtime; production UI verification did not run.')
          PY
      - name: Play the deployed stage through its real menu
        run: python3 "scripts/qa-${PLAYGROUND_LIVE_GAME}-browser.py" --base https://icefoxtail.github.io/my-life-os/ --output qa-production-evidence
      - name: Attach production menu and screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-ui-${{ github.run_id }}
          path: qa-production-evidence/
          if-no-files-found: warn
          retention-days: 14
  quantity-games:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify quantities, cancellation and staged game models
        run: |
          node scripts/qa-quantity-play-model.cjs
          node scripts/qa-quantity-sequencer.cjs
          for suite in art-play-bridge ten-frame-garden picture-arithmetic; do
            if test -f "scripts/qa-$suite.cjs"; then node "scripts/qa-$suite.cjs"; fi
          done
      - name: Install pinned browser harness
        run: |
          mkdir -p qa-quantity-evidence
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Automatic picture counting and staged quantity games
        run: |
          status=0
          for game in art-reference number-picture ten-frame-garden picture-arithmetic; do
            if test -f "scripts/qa-$game-browser.py"; then
              python3 "scripts/qa-$game-browser.py" --output "qa-quantity-evidence/$game" || status=1
            fi
          done
          exit "$status"
      - name: Attach quantity-game evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quantity-browser-${{ github.run_id }}
          path: qa-quantity-evidence/
          if-no-files-found: warn
          retention-days: 14
