name: Apply reviewed vehicle mattes
on:
  pull_request:
    paths:
      - 'docs/qa/sihyeon-phase2/vehicle-matte-approved*.json'
      - 'scripts/apply-reviewed-vehicle-mattes.py'
      - 'scripts/finalize-vehicle-phase2-audit.py'
      - '.github/workflows/apply-reviewed-vehicle-mattes.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: reviewed-vehicle-matte-writer
  cancel-in-progress: false
jobs:
  apply-reviewed:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/sihyeon-vehicle-phase2-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify writer lease and integrate main without rewriting history
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          branch=refs/heads/feat/sihyeon-vehicle-phase2-20261108
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$EXPECTED"
          git config user.name 'Sihyeon Reviewed Asset Delivery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit refs/remotes/origin/main
          if test "$(git rev-parse HEAD)" != "$EXPECTED"; then
            test "$(git ls-remote origin "$branch" | cut -f1)" = "$EXPECTED"
            git push origin HEAD:"$branch"
            test "$(git ls-remote origin "$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          fi
          printf 'integration %s\n' "$(git rev-parse HEAD)" > reviewed-delivery-heads.txt
      - name: Apply each explicit batch and finalize inspected dispositions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install pillow numpy requests
          branch=refs/heads/feat/sihyeon-vehicle-phase2-20261108
          for batch in farm road_service port town-a town-b fire_special precision final-dispositions; do
            expected="$(git rev-parse HEAD)"
            test "$(git ls-remote origin "$branch" | cut -f1)" = "$expected"
            if test "$batch" = final-dispositions; then
              python3 scripts/finalize-vehicle-phase2-audit.py
            else
              python3 scripts/apply-reviewed-vehicle-mattes.py --batch "$batch"
            fi
            git add assets/vehicles js/vehicle-display.js docs/qa/sihyeon-phase2
            if ! git diff --cached --quiet; then
              test "$(git ls-remote origin "$branch" | cut -f1)" = "$expected"
              git commit -m "qa: preserve reviewed $batch with source-bound proof"
              git push origin HEAD:"$branch"
              test "$(git ls-remote origin "$branch" | cut -f1)" = "$(git rev-parse HEAD)"
            fi
            printf '%s %s\n' "$batch" "$(git rev-parse HEAD)" >> reviewed-delivery-heads.txt
          done
          git rev-parse HEAD > reviewed-delivery-head.txt
          git diff-tree --no-commit-id --name-status -r HEAD > reviewed-delivery-files.txt
      - name: Attach exact delivery for readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-vehicle-delivery-${{ github.run_id }}
          path: |
            reviewed-delivery-head*.txt
            reviewed-delivery-files.txt
            assets/vehicles/
            js/vehicle-display.js
            docs/qa/sihyeon-phase2/vehicle-inventory.json
            docs/qa/sihyeon-phase2/vehicle-visual-review.json
            docs/qa/sihyeon-phase2/vehicle-final-dispositions.*
            docs/qa/sihyeon-phase2/vehicle-matte-provenance.json
            docs/qa/sihyeon-phase2/comparisons/
            docs/qa/sihyeon-phase2/contact/
          if-no-files-found: error
          retention-days: 14
