name: Small screen UI review

on:
  push:
    branches: ['fix/small-screen-clipping-20261117']
    paths:
      - 'js/games/construction-site.js'
      - 'js/games/coding-car.js'
      - 'scripts/qa-small-screen-ui-browser.py'
      - '.github/workflows/small-screen-ui-review.yml'

permissions:
  contents: read

jobs:
  changed-screens:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_SHA: 23fd7f9af6e28034d1a6a3062e293742b3d66cb7
      TABLET_BASE_SHA: a857c31a130e9bd8ba41ab658a34a140813a91b9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check scoped source and preserved assets
        run: |
          node --check js/games/construction-site.js
          node --check js/games/coding-car.js
          python3 -m py_compile scripts/qa-small-screen-ui-browser.py
          git diff --exit-code "$BASE_SHA" -- assets/vehicles js/vehicle-display.js js/engine/pixi-runtime.js js/games-pixi/number-vehicles-pixi.js
      - name: Install pinned Chromium
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      # Run 43903458052 preserves the original main reproductions and the
      # unchanged construction checks. This follow-up changes only coding CSS.
      - name: Reproduce the tablet command-slot overlap
        id: before
        run: |
          git worktree add --detach "$RUNNER_TEMP/small-screen-baseline" "$TABLET_BASE_SHA"
          python3 scripts/qa-small-screen-ui-browser.py --root "$RUNNER_TEMP/small-screen-baseline" --output qa-small-screen/tablet-before --tablet-baseline
      - name: Inspect coding screens and touch scrolling
        if: always() && steps.before.outcome != 'skipped'
        run: python3 scripts/qa-small-screen-ui-browser.py --root . --output qa-small-screen/coding-after --game coding
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: small-screen-ui-${{ github.run_id }}
          path: qa-small-screen/
          if-no-files-found: warn
          retention-days: 14
