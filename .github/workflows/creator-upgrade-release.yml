name: Creator upgrade release

on:
  pull_request:
    paths:
      - 'js/games/vehicle-memory.js'
      - 'js/games/construction-site.js'
      - 'js/games/number-count.js'
      - 'js/games/color-balloon.js'
      - 'js/games/megaDispatch.js'
      - 'js/games/life-sequence.js'
      - 'js/games/pattern-train.js'
      - 'js/games/pattern-train-model.js'
      - 'js/engine/webgl-fallback.js'
      - 'games/hangul-playmat-3d.html'
      - 'games/number-kingdom-3d.html'
      - 'sw.js'
      - 'scripts/test-creator-*'
      - 'scripts/qa-creator-*'
      - '.github/workflows/creator-upgrade-release.yml'
  push:
    branches: [main]
    paths:
      - 'js/games/vehicle-memory.js'
      - 'js/games/construction-site.js'
      - 'js/games/number-count.js'
      - 'js/games/color-balloon.js'
      - 'js/games/megaDispatch.js'
      - 'js/games/life-sequence.js'
      - 'js/games/pattern-train.js'
      - 'js/games/pattern-train-model.js'
      - 'js/engine/webgl-fallback.js'
      - 'games/hangul-playmat-3d.html'
      - 'games/number-kingdom-3d.html'
      - 'sw.js'
      - 'scripts/test-creator-*'
      - 'scripts/qa-creator-*'
      - '.github/workflows/creator-upgrade-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Counterexamples and existing input regression
        run: |
          node scripts/test-creator-vehicle-rules.cjs
          node scripts/test-creator-hangul-rules.cjs
          node scripts/test-creator-number-language.cjs
          node scripts/test-creator-count-pace.cjs
          node scripts/test-creator-help-modes.cjs
          node scripts/test-creator-memory-pace.cjs
          node scripts/test-creator-number-mute.cjs
          node scripts/test-creator-life-pace.cjs
          node scripts/test-creator-train-edit.cjs
          node scripts/qa-pattern-train-model.cjs
          node scripts/qa-pattern-train-independent.cjs
          node scripts/qa-pattern-train-ui-independent.cjs
          node scripts/test-legacy-models.cjs
          node scripts/test-legacy-inputs.cjs
          node scripts/test-legacy-fallback.cjs
          node scripts/qa-sw-independent.cjs

  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned browser
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - name: Wait for the exact production runtime
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,time,urllib.request
          paths=['sw.js','js/games/vehicle-memory.js','js/games/construction-site.js','js/games/number-count.js','js/games/color-balloon.js','js/games/megaDispatch.js','js/games/life-sequence.js','js/games/pattern-train.js','js/games/pattern-train-model.js','js/engine/webgl-fallback.js','games/hangul-playmat-3d.html','games/number-kingdom-3d.html']
          expected={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          out=pathlib.Path('qa-creator-evidence');out.mkdir(exist_ok=True)
          deadline=time.monotonic()+50*60
          while time.monotonic()<deadline:
              actual={}
              try:
                  for path in paths:
                      with urllib.request.urlopen('https://icefoxtail.github.io/my-life-os/'+path+'?creator='+expected['sw.js'][:12],timeout=15) as response:
                          actual[path]=hashlib.sha256(response.read()).hexdigest()
              except Exception as error:
                  print(type(error).__name__,flush=True)
              if actual==expected:
                  (out/'production-source.json').write_text(json.dumps({'matches':True,'expected':expected,'actual':actual},indent=2))
                  break
              time.sleep(5)
          else:
              raise SystemExit('Exact main runtime not served by Pages; production play did not run.')
          PY
      - name: Actual menu, duplicate cards, word pictures and quantity language
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          status=0
          args=()
          if [ "$EVENT_NAME" = push ]; then
            args=(--base-url https://icefoxtail.github.io/my-life-os/)
          fi
          for suite in vehicle hangul number count-pace help memory-pace number-mute life-pace train-edit; do
            python3 "scripts/qa-creator-$suite-browser.py" "${args[@]}" --output "qa-creator-evidence/$suite" || status=1
          done
          exit "$status"
      - name: Preserve source-bound reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: creator-rules-${{ github.run_id }}
          path: qa-creator-evidence/
          if-no-files-found: error
          retention-days: 14
